# Image du serveur (Dockerfile : crates/opentunnel-server + site) pour le
# cluster Devver, sur ghcr.io/devver-inc/opentunnel-server.
# Tags : 1.2.3 / 1.2 / 1 (tag git v1.2.3, SANS le v), edge (master),
# sha-<court>, et le nom de branche pour les branches de test.
name: Image ghcr (opentunnel-server)

on:
  push:
    branches:
      - master
      - "ci/**"
      - "feat/**"
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/devver-inc/opentunnel-server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=edge,enable={{is_default_branch}}
            type=ref,event=branch,enable=${{ github.ref != 'refs/heads/master' }}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
